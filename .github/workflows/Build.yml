name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Android SDK command-line tools
      run: |
        sudo mkdir -p /opt/android-sdk/cmdline-tools
        sudo chown $USER /opt/android-sdk
        curl -sSfL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d /tmp
        mkdir -p /opt/android-sdk/cmdline-tools/latest
        mv /tmp/cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
        rm cmdline-tools.zip

    - name: Accept SDK licenses & install build tools and platform
      run: |
        yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      shell: bash

    - name: Ensure gradlew is executable
      run: chmod +x ./gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/**/debug/*.apk

    - name: Build release APK (unsigned)
      run: ./gradlew assembleRelease --no-daemon || true

    - name: Upload release APK artifact (if produced)
      uses: actions/upload-artifact@v3
      with:
        name: app-release.apk
        path: app/build/outputs/apk/**/release/*.apk
