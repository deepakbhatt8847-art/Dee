name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11 (Temurin) and enable Gradle cache
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'gradle'

    - name: Install Android SDK command-line tools
      run: |
        sudo mkdir -p /opt/android-sdk/cmdline-tools
        sudo chown $USER /opt/android-sdk
        curl -sSfL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d /tmp
        mkdir -p /opt/android-sdk/cmdline-tools/latest
        mv /tmp/cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
        rm cmdline-tools.zip
      shell: bash

    - name: Accept SDK licenses & install build tools and platform
      run: |
        yes | /opt/android-sdk/cmdline-tools/latest](#)
